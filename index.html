<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netdisk</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --fg:#1f2328; --muted:#656d76;
    --line:#d8dee4; --accent:#3ecf8e; --accent2:#1f6feb; --accent-fg:#08231a;
    --danger:#cf222e; --ok:#1a7f37;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --muted:#8b949e;
           --line:#30363d; --accent:#3ecf8e; --danger:#f85149; --ok:#3fb950; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif}
  .view{max-width:980px;margin:0 auto;padding:24px 16px 64px}
  .hidden{display:none !important}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;
        box-shadow:0 1px 3px rgba(0,0,0,.06)}
  h1{font-size:20px;margin:0 0 6px}
  h2{font-size:16px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
        background:var(--bg);color:var(--fg);font-size:14px;font-family:inherit}
  input:focus{outline:2px solid var(--accent2);outline-offset:-1px;border-color:transparent}
  button{font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:8px;
         border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--muted)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);
                 width:100%;margin-top:20px}
  button.primary:hover{border-color:var(--accent);filter:brightness(1.05)}
  button.tiny{padding:3px 9px;font-size:12px;font-weight:500}
  button.danger{color:var(--danger)}
  button.link{background:none;border:none;color:var(--accent2);padding:2px 4px;font-weight:500}
  .msg{font-size:13px;margin:12px 0 0;min-height:18px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
  .tabs{display:flex;gap:6px;margin-bottom:4px}
  .tabs button{flex:1;border-radius:8px}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  header.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  header.bar .who{color:var(--muted);font-size:13px;margin-right:auto}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .toolbar input{flex:1;min-width:150px}
  .crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:13px;color:var(--muted);
          padding:8px 12px;background:var(--card);border:1px solid var(--line);border-bottom:none;
          border-radius:12px 12px 0 0}
  .list{background:var(--card);border:1px solid var(--line);border-radius:0 0 12px 12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--bg)}
  .row .ic{width:20px;text-align:center;font-size:15px}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .row .sz{color:var(--muted);font-size:12px;white-space:nowrap}
  .empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
  .drop{position:fixed;inset:0;background:rgba(62,207,142,.14);border:3px dashed var(--accent);
        display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;
        color:var(--fg);z-index:50}
  #uploads{margin-top:14px}
  .up{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 12px;background:var(--card);
      border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
  .up .nm{flex:0 1 34%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .up .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .up .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .up .st{color:var(--muted);font-size:12px;white-space:nowrap;min-width:52px;text-align:right}
  .up .st.err{color:var(--danger)} .up .st.ok{color:var(--ok)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);
        border-top-color:var(--accent2);border-radius:50%;animation:s .7s linear infinite;vertical-align:-1px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ========== 1. 登录 / 注册 ========== -->
<div id="authView" class="view hidden">
  <form id="authForm" class="card" autocomplete="on">
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">登录</button>
      <button type="button" id="tabSignup">注册</button>
    </div>
    <h1 id="authTitle" style="margin-top:18px">登录 netdisk</h1>
    <p class="sub" id="authSub">用户名 + 密码，不需要邮箱。</p>

    <label for="inUser">用户名</label>
    <input id="inUser" type="text" placeholder="1~10 个汉字，或 1~30 个字母" autocomplete="username" required>

    <label for="inPass">密码</label>
    <input id="inPass" type="password" placeholder="至少 6 位" autocomplete="current-password" required>

    <button class="primary" type="submit" id="authBtn">登 录</button>
    <p id="authMsg" class="msg"></p>
  </form>
</div>

<!-- ========== 2. 网盘 ========== -->
<div id="appView" class="view hidden">
  <header class="bar">
    <h2>netdisk</h2>
    <span class="who" id="whoami"></span>
    <button class="tiny" id="btnLogout">退出登录</button>
  </header>

  <div class="toolbar">
    <button id="btnUpload" class="primary" style="width:auto;margin:0">上传文件</button>
    <button id="btnFolder">新建文件夹</button>
    <button id="btnRefresh">刷新</button>
    <input id="inFilter" type="search" placeholder="过滤当前目录…">
    <input id="fileInput" type="file" multiple hidden>
  </div>

  <div class="crumbs" id="crumbs"></div>
  <div class="list" id="list"></div>
  <div id="uploads"></div>
</div>

<div class="drop hidden" id="drop">松开鼠标即可上传到当前目录</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  /* ============ 后端连接配置（换 Supabase 项目就改这里）============ */
  var DEFAULT_CFG = {
    url: 'https://hkljstgxxefxqxgclxmm.supabase.co',
    key: 'sb_publishable_Vc-UqVqCMTAqfxCOTCcE7g_A4KVE9bU'   // 公开密钥，可以安全地放在网页里
  };
  /* ================================================================ */

  var BUCKET = 'netdisk';
  var PLACEHOLDER = '.folderkeep';       // 用来表示空文件夹
  var CHUNK_DIR = '.chunks';             // 大文件分块存放的隐藏目录
  var CHUNK = 45 * 1024 * 1024;          // 每块 45 MB（服务端单文件上限 50 MB）
  var chunkIndex = {};                   // 当前目录已存在的分块：{base: [{idx,size}]}

  var cfg = null, sb = null, user = null, token = null;
  var path = '';
  var items = [];

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtSize(n) {
    if (n == null) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  function toast(el, text, kind) { el.textContent = text || ''; el.className = 'msg' + (kind ? ' ' + kind : ''); }

  /* ---------- 文件名转义 ----------
     Supabase Storage 只接受一部分 ASCII 字符，中文以及 # % ~ [ ] { } | < > \\ " ^ ` 等
     一律报 "Invalid key"。所以存进存储的名字要把这些字节转义掉，显示时再还原：
       字面保留   A-Za-z0-9 空格 . _ - + & = , ; ' ( ) $ @ :
       其余字节   !hh   （两个小写十六进制位，对应 UTF-8 字节）
     用户看到的仍是原名，下载时保存的文件名也是原名。                        */
  var SAFE_NAME = /[A-Za-z0-9 ._\-+&=,;'()$@:]/;
  var ESC_NAME = '!';

  function encName(s) {
    var bytes = new TextEncoder().encode(String(s));
    var out = '';
    for (var i = 0; i < bytes.length; i++) {
      var b = bytes[i];
      out += (b < 128 && SAFE_NAME.test(String.fromCharCode(b)))
        ? String.fromCharCode(b)
        : ESC_NAME + (b < 16 ? '0' : '') + b.toString(16);
    }
    // 避开内部保留目录名，保证普通文件名不会和分块目录撞车（解码时会还原）
    if (out.indexOf(CHUNK_DIR) === 0) out = ESC_NAME + '2e' + out.slice(1);
    return out;
  }

  function decName(s) {
    var out = [];
    for (var i = 0; i < s.length; i++) {
      if (s.charAt(i) === ESC_NAME && /^[0-9a-fA-F]{2}$/.test(s.substr(i + 1, 2))) {
        out.push(parseInt(s.substr(i + 1, 2), 16));
        i += 2;
      } else {
        out.push(s.charCodeAt(i));
      }
    }
    return new TextDecoder().decode(new Uint8Array(out));
  }

  function show(view) {
    ['authView', 'appView'].forEach(function (v) {
      $(v).classList.toggle('hidden', v !== view);
    });
  }

  /* ============ 登录 / 注册 ============ */

  var mode = 'login';

  /* ---------- 用户名 <-> 内部账号 ----------
     Supabase Auth 底层只认邮箱或手机号，所以把用户名编码成一个固定的内部邮箱：
       用户名 --UTF-8 字节转十六进制-->  u_<hex>@netdisk.local
     十六进制编码是唯一的，不会撞号，中文、空格、符号都能用；
     用户全程只看到和使用用户名，永远不需要接触邮箱。                       */
  function nameToEmail(name) {
    var bytes = new TextEncoder().encode(String(name).toLowerCase());
    var hex = '';
    for (var i = 0; i < bytes.length; i++) {
      var h = bytes[i].toString(16);
      hex += h.length === 1 ? '0' + h : h;
    }
    return 'u_' + hex + '@netdisk.local';
  }
  function nameBytes(name) {
    return new TextEncoder().encode(String(name).toLowerCase()).length;
  }
  function displayName(u) {
    return (u && u.user_metadata && u.user_metadata.username) || '用户';
  }

  function setMode(m) {
    mode = m;
    $('tabLogin').classList.toggle('on', m === 'login');
    $('tabSignup').classList.toggle('on', m === 'signup');
    $('authTitle').textContent = m === 'login' ? '登录 netdisk' : '注册新账号';
    $('authSub').textContent = m === 'login'
      ? '用户名 + 密码，不需要邮箱。'
      : '注册后即可拥有自己的独立空间，看不到别人的文件。';
    $('authBtn').textContent = m === 'login' ? '登 录' : '注 册';
    $('inPass').value = '';
    toast($('authMsg'), '');
  }
  $('tabLogin').addEventListener('click', function () { setMode('login'); });
  $('tabSignup').addEventListener('click', function () { setMode('signup'); });

  $('authForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('inUser').value.trim();
    var pass = $('inPass').value;
    var btn = $('authBtn'), msg = $('authMsg');
    if (!name) { toast(msg, '请输入用户名', 'err'); return; }
    if (name.indexOf('@') >= 0) { toast(msg, '用户名里不能有 @', 'err'); return; }
    if (nameBytes(name) > 30) { toast(msg, '用户名太长（最多约 10 个汉字或 30 个字母）', 'err'); return; }
    if (pass.length < 6) { toast(msg, '密码至少 6 位', 'err'); return; }

    btn.disabled = true;
    toast(msg, '请稍候…');
    var email = nameToEmail(name);
    var task = mode === 'login'
      ? sb.auth.signInWithPassword({ email: email, password: pass })
      : sb.auth.signUp({ email: email, password: pass, options: { data: { username: name } } });

    task.then(function (res) {
      if (res.error) throw new Error(res.error.message);
      if (mode === 'signup' && !res.data.session) {
        toast(msg, '注册成功，但账号尚未激活，请联系管理员。', 'ok');
      } else {
        toast(msg, '');
      }
    }).catch(function (err) {
      var m = err.message || String(err);
      if (/Invalid login credentials/i.test(m)) m = '用户名或密码不正确';
      if (/already registered/i.test(m)) m = '这个用户名已经被占用了，换一个，或者点【登录】';
      if (/at least 6 characters/i.test(m)) m = '密码至少 6 位';
      if (/Email not confirmed/i.test(m)) m = '账号尚未激活，请联系管理员';
      if (/rate limit|Too many/i.test(m)) m = '请求太频繁，等一会儿再试';
      if (/Password should be at least/i.test(m)) m = '密码太短，至少 6 位';
      toast(msg, m, 'err');
    }).then(function () { btn.disabled = false; });
  });

  /* ============ 进入网盘 ============ */

  var currentUserId = null;

  function enterApp(u, t) {
    token = t;
    if (currentUserId === u.id && !$('appView').classList.contains('hidden')) { user = u; return; }
    currentUserId = u.id;
    user = u;
    $('whoami').textContent = displayName(u);
    show('appView');
    path = '';
    refresh();
  }

  $('btnLogout').addEventListener('click', function () { sb.auth.signOut(); });

  /* ============ 路径 ============ */

  function fullPath(p) { return user.id + (p ? '/' + p : ''); }

  /* ============ 列目录 ============ */

  function refresh() {
    var list = $('list');
    list.innerHTML = '<div class="empty"><span class="spin"></span> 加载中…</div>';
    renderCrumbs();

    var folder = fullPath(path);
    chunkIndex = {};
    sb.storage.from(BUCKET).list(folder, { limit: 1000, sortBy: { column: 'name', order: 'asc' } })
      .then(function (res) {
        if (res.error) throw new Error(res.error.message);
        var raw = res.data || [];
        var hasChunkDir = raw.some(function (it) { return it.name === CHUNK_DIR && it.id === null; });

        var all = raw
          .filter(function (it) { return it.name !== PLACEHOLDER && it.name !== CHUNK_DIR; })
          .map(function (it) {
            var isDir = it.id === null;
            return {
              name: it.name,                         // 存储里的名字（已转义）
              disp: decName(it.name),                // 给用户看的原名
              path: (path ? path + '/' : '') + it.name,
              isDir: isDir,
              big: false,
              size: isDir ? null : (it.metadata ? it.metadata.size : null)
            };
          });

        if (!hasChunkDir) return all;

        // 有分块目录时，再列一次把大文件拼回成单个条目
        return sb.storage.from(BUCKET).list(folder + '/' + CHUNK_DIR, { limit: 1000 })
          .then(function (res2) {
            if (res2.error) throw new Error(res2.error.message);
            var groups = {}, finished = {};
            (res2.data || []).forEach(function (k) {
              var n = k.name;
              if (n.slice(-5) === '.done') { finished[n.slice(0, -5)] = true; return; }
              var dot = n.lastIndexOf('.');
              if (dot <= 0) return;
              var suf = n.slice(dot + 1);
              if (!/^[0-9]{4}$/.test(suf)) return;
              var base = n.slice(0, dot);
              (groups[base] = groups[base] || []).push({
                idx: parseInt(suf, 10),
                size: (k.metadata && k.metadata.size) || 0
              });
            });
            chunkIndex = groups;
            Object.keys(groups).forEach(function (base) {
              if (!finished[base]) return;          // 没有完成标记 = 传了一半，不显示
              var parts = groups[base], maxIdx = 0, total = 0;
              parts.forEach(function (p) { if (p.idx > maxIdx) maxIdx = p.idx; total += p.size; });
              if (parts.length !== maxIdx) return;   // 缺块也不显示
              all.push({
                name: base,
                disp: decName(base),
                path: (path ? path + '/' : '') + CHUNK_DIR + '/' + base,
                isDir: false,
                big: true,
                parts: maxIdx,
                size: total
              });
            });
            return all;
          });
      })
      .then(function (all) {
        items = all.sort(function (a, b) {
          if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
          return a.disp.localeCompare(b.disp, 'zh');
        });
        renderList();
      })
      .catch(function (err) {
        list.innerHTML = '<div class="empty" style="color:var(--danger)">' + esc(err.message) + '</div>';
      });
  }

  function renderCrumbs() {
    var box = $('crumbs');
    box.innerHTML = '';
    var root = document.createElement('button');
    root.className = 'link';
    root.textContent = '📁 netdisk';
    root.onclick = function () { path = ''; refresh(); };
    box.appendChild(root);

    var parts = path.split('/').filter(Boolean), acc = '';
    parts.forEach(function (p) {
      acc = acc ? acc + '/' + p : p;
      var sep = document.createElement('span');
      sep.textContent = '/';
      box.appendChild(sep);
      var b = document.createElement('button');
      b.className = 'link';
      b.textContent = decName(p);
      var target = acc;
      b.onclick = function () { path = target; refresh(); };
      box.appendChild(b);
    });
  }

  function renderList() {
    var list = $('list');
    var kw = ($('inFilter').value || '').trim().toLowerCase();
    var view = items.filter(function (it) { return !kw || it.disp.toLowerCase().indexOf(kw) >= 0; });

    if (!view.length) {
      list.innerHTML = '<div class="empty">' +
        (items.length ? '没有匹配的文件' : '这个目录是空的，点「上传文件」或把文件拖进来') +
        '</div>';
      return;
    }

    list.innerHTML = '';
    view.forEach(function (it) {
      var row = document.createElement('div');
      row.className = 'row';

      var ic = document.createElement('div');
      ic.className = 'ic';
      ic.textContent = it.isDir ? '📁' : '📄';

      var nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = it.disp;
      nm.title = it.path.split('/').map(decName).join('/');
      nm.onclick = it.isDir
        ? function () { path = it.path; refresh(); }
        : function () { doDownload(it); };

      var sz = document.createElement('div');
      sz.className = 'sz';
      sz.textContent = it.isDir ? '文件夹' : fmtSize(it.size);

      var ops = document.createElement('div');
      var del = document.createElement('button');
      del.className = 'tiny danger';
      del.textContent = '删除';
      del.onclick = function () { doDelete(it); };
      ops.appendChild(del);

      row.appendChild(ic); row.appendChild(nm); row.appendChild(sz); row.appendChild(ops);
      list.appendChild(row);
    });
  }

  /* ============ 下载 ============ */

  function saveBlob(blob, filename) {
    var a = document.createElement('a');
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  function doDownload(it) {
    if (it.big) { doDownloadBig(it); return; }
    sb.storage.from(BUCKET)
      .createSignedUrl(fullPath(it.path), 60, { download: it.disp })
      .then(function (res) {
        if (res.error) throw new Error(res.error.message);
        var a = document.createElement('a');
        a.href = res.data.signedUrl;
        a.download = it.disp;
        document.body.appendChild(a);
        a.click();
        a.remove();
      })
      .catch(function (err) { alert('下载失败：' + err.message); });
  }

  // 大文件：逐个取回每一块，在内存里拼成一个 Blob 再保存
  function doDownloadBig(it) {
    var total = it.parts;
    var box = $('uploads');
    box.innerHTML = '';
    var row = document.createElement('div');
    row.className = 'up';
    row.innerHTML = '<span class="nm">' + esc(it.disp) + '</span>' +
      '<span class="bar"><i></i></span><span class="st">0%</span>';
    box.appendChild(row);
    var bar = row.querySelector('.bar i');
    var st = row.querySelector('.st');
    var blobs = new Array(total);
    var got = 0;

    function load(i) {
      if (i > total) return Promise.resolve();
      return sb.storage.from(BUCKET).download(fullPath(it.path) + '.' + pad4(i))
        .then(function (res) {
          if (res.error) throw new Error(res.error.message);
          blobs[i - 1] = res.data;
          got++;
          var pct = Math.round(got / total * 100);
          bar.style.width = pct + '%';
          st.textContent = pct + '%';
          return load(i + 1);
        });
    }

    load(1).then(function () {
      bar.style.width = '100%';
      st.className = 'st ok';
      st.textContent = '完成';
      saveBlob(new Blob(blobs, { type: 'application/octet-stream' }), it.disp);
    }).catch(function (err) {
      bar.style.background = 'var(--danger)';
      st.className = 'st err';
      st.textContent = err.message;
    });
  }

  /* ============ 删除 ============ */

  function listAllFiles(prefix, out) {
    return sb.storage.from(BUCKET).list(prefix, { limit: 1000 }).then(function (res) {
      if (res.error) throw new Error(res.error.message);
      var kids = res.data || [];
      var chain = Promise.resolve();
      kids.forEach(function (k) {
        chain = chain.then(function () {
          if (k.id === null) return listAllFiles(prefix + '/' + k.name, out);
          out.push(prefix + '/' + k.name);
        });
      });
      return chain.then(function () { return out; });
    });
  }

  function doDelete(it) {
    var label = it.isDir
      ? '确定删除文件夹「' + it.disp + '」及里面所有文件吗？此操作不可恢复。'
      : '确定删除「' + it.disp + '」吗？此操作不可恢复。';
    if (!confirm(label)) return;

    var job;
    if (it.isDir) {
      job = listAllFiles(fullPath(it.path), []).then(function (files) {
        if (!files.length) return { error: null };
        return sb.storage.from(BUCKET).remove(files);
      });
    } else if (it.big) {
      var paths = [fullPath(it.path) + '.done'];
      for (var i = 1; i <= it.parts; i++) paths.push(fullPath(it.path) + '.' + pad4(i));
      job = sb.storage.from(BUCKET).remove(paths);
    } else {
      job = sb.storage.from(BUCKET).remove([fullPath(it.path)]);
    }

    job.then(function (res) {
      if (res && res.error) throw new Error(res.error.message);
      refresh();
    }).catch(function (err) { alert('删除失败：' + err.message); });
  }

  /* ============ 新建文件夹 ============ */

  $('btnFolder').addEventListener('click', function () {
    var name = (prompt('新建文件夹名称：') || '').trim().replace(/^\/+|\/+$/g, '');
    if (!name) return;
    if (name.indexOf('/') >= 0) { alert('名称里不能包含 /'); return; }

    var target = fullPath((path ? path + '/' : '') + encName(name) + '/' + PLACEHOLDER);
    sb.storage.from(BUCKET).upload(target, new Blob(['folder placeholder']), {
      upsert: true, contentType: 'text/plain'
    }).then(function (res) {
      if (res.error) throw new Error(res.error.message);
      refresh();
    }).catch(function (err) { alert('新建失败：' + err.message); });
  });

  /* ============ 上传（带进度） ============ */

  function pad4(i) { return ('0000' + i).slice(-4); }

  function friendlyUploadError(xhr) {
    var m = xhr.responseText || '';
    try {
      var j = JSON.parse(xhr.responseText);
      m = j.message || j.error || m;
    } catch (e) {}
    if (/Bucket not found|NoSuchBucket/i.test(m)) m = '存储服务未就绪，请联系管理员';
    if (/InvalidKey/i.test(m)) m = '文件名含不被支持的特殊字符';
    if (/row-level security/i.test(m)) m = '服务器拒绝了这次上传，请联系管理员';
    if (xhr.status === 413 || /Payload too large|EntityTooLarge|maximum allowed size/i.test(m)) m = '单块超过服务端上限';
    if (/exceeded|quota/i.test(m) && /storage|space/i.test(m)) m = '空间不足';
    if (xhr.status === 403) m = '服务器拒绝了这次上传，请稍后重试';
    return m || ('上传失败 ' + xhr.status);
  }

  function putRaw(pathInBucket, blob, onProgress, contentType) {
    return new Promise(function (resolve, reject) {
      var url = cfg.url + '/storage/v1/object/' + BUCKET + '/' +
        pathInBucket.split('/').map(encodeURIComponent).join('/');
      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Authorization', 'Bearer ' + token);
      xhr.setRequestHeader('apikey', cfg.key);
      xhr.setRequestHeader('x-upsert', 'true');
      xhr.setRequestHeader('Content-Type', contentType || 'application/octet-stream');
      xhr.setRequestHeader('cache-control', '3600');
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
      };
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) { resolve(); return; }
        reject(new Error(friendlyUploadError(xhr)));
      };
      xhr.onerror = function () { reject(new Error('网络错误或跨域被拦截')); };
      xhr.send(blob);
    });
  }

  // 小文件：一次传完
  function uploadPlain(file, dir, onProgress) {
    var base = encName(file.name);
    var target = fullPath((dir ? dir + '/' : '') + base);
    return putRaw(target, file, onProgress, file.type).then(function () {
      // 如果同名旧文件是分块存的，把旧分块清掉
      var parts = chunkIndex[base];
      if (!parts || !parts.length) return;
      var old = [fullPath((dir ? dir + '/' : '') + CHUNK_DIR + '/' + base + '.done')];
      var max = 0;
      parts.forEach(function (p) { if (p.idx > max) max = p.idx; });
      for (var i = 1; i <= max; i++) {
        old.push(fullPath((dir ? dir + '/' : '') + CHUNK_DIR + '/' + base + '.' + pad4(i)));
      }
      sb.storage.from(BUCKET).remove(old);
    });
  }

  // 大文件：切成 45MB 一块依次上传，最后写一个 .done 完成标记
  function uploadChunked(file, dir, onProgress) {
    var base = encName(file.name);
    var cd = (dir ? dir + '/' : '') + CHUNK_DIR;
    var total = Math.ceil(file.size / CHUNK);
    var sent = 0;
    var uploaded = [];

    function step(i) {
      if (i > total) return Promise.resolve();
      var start = (i - 1) * CHUNK;
      var end = Math.min(start + CHUNK, file.size);
      var slice = file.slice(start, end);
      var target = fullPath(cd + '/' + base + '.' + pad4(i));
      return putRaw(target, slice, function (p) {
        if (onProgress) onProgress((sent + p * slice.size) / file.size);
      }).then(function () {
        uploaded.push(target);
        sent += slice.size;
        if (onProgress) onProgress(sent / file.size);
        return step(i + 1);
      });
    }

    return step(1)
      .then(function () {
        var meta = JSON.stringify({ name: file.name, size: file.size, parts: total, chunk: CHUNK });
        return putRaw(fullPath(cd + '/' + base + '.done'),
          new Blob([meta], { type: 'application/json' }), null, 'application/json');
      })
      .then(function () {
        // 清掉同名的小文件版本，以及块数变少时残留的旧块，避免拼出脏数据
        var kill = [fullPath((dir ? dir + '/' : '') + base)];
        var old = chunkIndex[base] || [];
        var maxOld = 0;
        old.forEach(function (p) { if (p.idx > maxOld) maxOld = p.idx; });
        for (var k = total + 1; k <= maxOld; k++) {
          kill.push(fullPath(cd + '/' + base + '.' + pad4(k)));
        }
        sb.storage.from(BUCKET).remove(kill);
      })
      .catch(function (err) {
        // 失败时把已经传上去的块清掉，不留垃圾
        if (uploaded.length) sb.storage.from(BUCKET).remove(uploaded);
        throw err;
      });
  }

  function uploadOne(file, dir, onProgress) {
    return file.size > CHUNK
      ? uploadChunked(file, dir, onProgress)
      : uploadPlain(file, dir, onProgress);
  }

  function uploadFiles(files) {
    var list = Array.prototype.slice.call(files);
    if (!list.length) return;

    var box = $('uploads');
    box.innerHTML = '';
    var next = function (i) {
      if (i >= list.length) { refresh(); return; }
      var f = list[i];

      var row = document.createElement('div');
      row.className = 'up';
      row.innerHTML = '<span class="nm">' + esc(f.name) + '</span>' +
        '<span class="bar"><i></i></span>' +
        '<span class="st">0%</span>';
      box.appendChild(row);
      var bar = row.querySelector('.bar i');
      var st = row.querySelector('.st');

      uploadOne(f, path, function (p) {
        bar.style.width = (p * 100).toFixed(0) + '%';
        st.textContent = (p * 100).toFixed(0) + '%';
      }).then(function () {
        bar.style.width = '100%';
        st.className = 'st ok';
        st.textContent = '完成';
      }).catch(function (err) {
        bar.style.background = 'var(--danger)';
        st.className = 'st err';
        st.textContent = err.message;
      }).then(function () { next(i + 1); });
    };
    next(0);
  }

  $('btnUpload').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function (e) {
    uploadFiles(e.target.files);
    e.target.value = '';
  });
  $('btnRefresh').addEventListener('click', refresh);
  $('inFilter').addEventListener('input', renderList);

  /* ============ 拖拽上传 ============ */

  var dropEl = $('drop'), depth = 0;
  window.addEventListener('dragenter', function (e) {
    if ($('appView').classList.contains('hidden')) return;
    if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
    depth++; dropEl.classList.remove('hidden');
  });
  window.addEventListener('dragover', function (e) {
    if (!dropEl.classList.contains('hidden')) e.preventDefault();
  });
  window.addEventListener('dragleave', function () {
    depth = Math.max(0, depth - 1);
    if (!depth) dropEl.classList.add('hidden');
  });
  window.addEventListener('drop', function (e) {
    if (dropEl.classList.contains('hidden')) return;
    e.preventDefault(); depth = 0; dropEl.classList.add('hidden');
    if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });

  /* ============ 启动 ============ */

  function boot() {
    if (!cfg || !cfg.url || !cfg.key) {
      show('authView');
      toast($('authMsg'), '站点还没有配置后端连接，请联系管理员。', 'err');
      $('authBtn').disabled = true;
      return;
    }
    sb = window.supabase.createClient(cfg.url, cfg.key);

    // onAuthStateChange 回调里不能直接调用其他 supabase 方法（会死锁），必须让出当前调用栈
    sb.auth.onAuthStateChange(function (event, session) {
      setTimeout(function () {
        if (session && session.user) {
          enterApp(session.user, session.access_token);
        } else {
          currentUserId = null; user = null; token = null;
          if (event === 'SIGNED_OUT') { setMode('login'); toast($('authMsg'), '已退出登录'); }
          show('authView');
        }
      }, 0);
    });

    sb.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      if (session && session.user) enterApp(session.user, session.access_token);
      else { setMode('login'); show('authView'); }
    });
  }

  cfg = DEFAULT_CFG;
  boot();
})();
</script>
</body>
</html>
